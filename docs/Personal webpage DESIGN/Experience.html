<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stef Vanremoortele — Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #050505;
    --fg: #f4f4f3;
    --muted: #9ca0a3;
    --dim: #6c6f72;
    --accent: oklch(0.86 0.14 172);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Manrope", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page { padding: 96px 32px; min-height: 100vh; }

  .exp {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 32px;
    max-width: 1180px;
  }

  .eyebrow {
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 28px;
    transition: color 600ms ease;
  }

  .exp-aside {
    position: sticky;
    top: 96px;
    align-self: start;
    height: fit-content;
  }

  /* ───── Era indicator */
  .era-stick {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    color: var(--accent);
  }
  .era-glyph svg {
    color: var(--accent);
    transition: color 600ms ease;
    filter: drop-shadow(0 0 16px color-mix(in oklch, var(--accent) 35%, transparent));
  }
  .era-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.32em;
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    transition: background-image 600ms ease;
  }
  .era-progress {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .era-progress .pip {
    width: 22px;
    height: 2px;
    border-radius: 2px;
    transition: background 500ms ease, width 500ms ease;
  }
  .era-progress .pip.on { width: 38px; }

  /* ───── Timeline */
  .exp-timeline {
    position: relative;
    padding-left: 28px;
  }
  .rail {
    position: absolute;
    left: 6px;
    top: 8px;
    bottom: 8px;
    width: 1px;
    background: linear-gradient(
      to bottom,
      oklch(0.78 0.16 305) 0%,
      oklch(0.78 0.16 305) 18%,
      oklch(0.84 0.13 78)  35%,
      oklch(0.84 0.13 78)  55%,
      oklch(0.86 0.14 172) 75%,
      oklch(0.86 0.14 172) 100%
    );
    opacity: 0.55;
  }

  .entry {
    position: relative;
    padding: 0 0 64px 0;
  }
  .entry:last-child { padding-bottom: 0; }

  .dot-wrap {
    position: absolute;
    left: -28px;
    top: 10px;
    width: 14px; height: 14px;
  }
  .dot-outer {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in oklch, var(--accent) 35%, transparent) 0%, transparent 70%);
  }
  .dot {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--bg);
  }

  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 20px;
    margin-bottom: 4px;
  }
  .entry-title {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--fg);
  }
  .entry-title .at {
    color: var(--muted);
    font-weight: 500;
  }
  .entry-period {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
    white-space: nowrap;
  }
  .entry-era {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    margin: 4px 0 14px;
    transition: color 600ms ease;
  }
  .entry p {
    color: #c8c9ca;
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 12px;
    max-width: 720px;
  }
  .entry .ref {
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
  }

  @media (max-width: 880px) {
    .page { padding: 56px 24px; }
    .exp { grid-template-columns: 1fr; gap: 36px; }
    .exp-aside { position: static; }
    .entry-head { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/flubber@0.4.2/build/flubber.min.js"></script>

  <script type="text/babel" src="experience.jsx"></script>
</body>
</html>
