<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stef Vanremoortele — Book a call</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #050505;
    --fg: #f4f4f3;
    --muted: #9ca0a3;
    --dim: #6c6f72;
    --accent: oklch(0.86 0.14 172);
    --glow: oklch(0.86 0.14 172 / 0.45);
    --line: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Manrope", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }

  .page { min-height: 100vh; padding: 96px 32px; display: flex; justify-content: center; }
  .book { width: 100%; max-width: 1080px; }

  .book-head { text-align: center; margin: 0 auto 48px; max-width: 720px; }
  .title {
    font-size: clamp(40px, 5.5vw, 72px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0 0 22px;
  }
  .lede {
    color: #c8c9ca; font-size: 18px; line-height: 1.6; margin: 0;
  }

  /* Calendar card */
  .cal {
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
    padding: 28px;
  }

  .cal-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .meta-pill {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid color-mix(in oklch, var(--accent) 35%, transparent);
    color: var(--fg);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
  }
  .meta-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 color-mix(in oklch, var(--accent) 50%, transparent);
    animation: pulseDot 2.2s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%,100% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--accent) 50%, transparent); }
    50%     { box-shadow: 0 0 0 6px transparent; }
  }
  .meta-tz {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* Day strip */
  .day-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 28px;
    scroll-snap-type: x mandatory;
  }
  .day-strip::-webkit-scrollbar { height: 4px; }
  .day-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

  .day {
    position: relative;
    flex: 0 0 76px;
    min-height: 86px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 12px 6px;
    transition: all 220ms ease;
    scroll-snap-align: start;
  }
  .day:not(:disabled):hover {
    border-color: color-mix(in oklch, var(--accent) 50%, transparent);
    transform: translateY(-1px);
  }
  .day.active {
    border-color: var(--accent);
    background: color-mix(in oklch, var(--accent) 12%, transparent);
    box-shadow: 0 0 40px -10px var(--glow);
  }
  .day.empty { opacity: 0.32; cursor: not-allowed; }

  .day .dow {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--dim);
  }
  .day.active .dow { color: var(--accent); }
  .day .dn {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .day .mo {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--muted);
  }
  .day .today-tag {
    position: absolute;
    top: -8px;
    right: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 8px;
    letter-spacing: 0.22em;
    background: var(--accent);
    color: #0a0a0a;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
  }
  .day .day-pip {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--dim);
  }
  .day .day-pip[data-on="1"] { background: var(--accent); }

  /* Body */
  .cal-body {}
  .cal-body-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .active-day {
    font-size: 18px;
    font-weight: 600;
  }
  .duration {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .duration .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }

  .slots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
    margin-bottom: 24px;
  }
  .slot {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--fg);
    padding: 12px 0;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.04em;
    transition: all 180ms ease;
  }
  .slot:hover {
    border-color: color-mix(in oklch, var(--accent) 60%, transparent);
    background: color-mix(in oklch, var(--accent) 7%, transparent);
  }
  .slot.selected {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    box-shadow: 0 0 30px -10px var(--glow);
  }

  .empty-state {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-size: 14px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    margin-bottom: 24px;
  }

  .cal-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .confirm {
    background: color-mix(in oklch, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
    color: var(--muted);
    border-radius: 999px;
    padding: 14px 26px;
    font-weight: 600;
    font-size: 15px;
    transition: all 250ms ease;
  }
  .confirm.ready {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    box-shadow: 0 0 60px -10px var(--glow);
  }
  .confirm:disabled { cursor: not-allowed; }

  .alt { color: var(--muted); text-decoration: none; font-size: 14px; }
  .alt:hover { color: var(--accent); }

  .contact-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 56px;
    color: var(--muted);
    font-size: 14px;
  }
  .contact-row a { color: inherit; text-decoration: none; }
  .contact-row a:hover { color: var(--accent); }

  @media (max-width: 700px) {
    .page { padding: 56px 16px; }
    .cal { padding: 18px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="booking.jsx"></script>
</body>
</html>
